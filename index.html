<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>RTX 5060 견적 최저가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 왼쪽은 부품별 가격비교 카드, 오른쪽은 고정된 견적 영수증. 폰에서는 영수증 요약이 위로 올라온다. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --sunk: #f6f8fb;
  --ink: #111820;
  --muted: #5a6574;
  --line: #dbe1e8;
  --low: #d7352b;        /* 최저가 */
  --low-soft: #fdecea;
  --act: #1d4fd6;        /* 선택·링크 */
  --act-soft: #e8eefc;
  --warn: #9a5b00;
  --warn-soft: #fff3d6;
  --big: #0f7a55;
  --big-soft: #e2f4ec;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1116; --surface: #161c23; --sunk: #11161c; --ink: #e6ebf1; --muted: #93a0b0; --line: #29313b;
  --low: #ff6b5e; --low-soft: #3a1c1a; --act: #7d9dff; --act-soft: #1c2640;
  --warn: #f2b84b; --warn-soft: #3a2d12; --big: #4fd3a0; --big-soft: #12302a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #161c23; --sunk: #11161c; --ink: #e6ebf1; --muted: #93a0b0; --line: #29313b;
  --low: #ff6b5e; --low-soft: #3a1c1a; --act: #7d9dff; --act-soft: #1c2640;
  --warn: #f2b84b; --warn-soft: #3a2d12; --big: #4fd3a0; --big-soft: #12302a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
a { color: var(--act); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }

.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 20px; letter-spacing: -0.02em; }
.brand b span { color: var(--low); }
.brand small { color: var(--muted); font-size: 13px; }

.modes { display: flex; flex-wrap: wrap; gap: 4px; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.modes button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 13.5px; color: var(--muted); font-weight: 500; }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); font-weight: 600; }

.page { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; padding-block: 20px 48px; }
@media (max-width: 900px) { .page { grid-template-columns: minmax(0, 1fr); } .receipt { order: -1; position: static !important; } }

.parts { display: grid; gap: 14px; min-width: 0; }
.part { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
.part-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; padding: 14px 16px 10px; }
.cat { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.pname { font-size: 17px; font-weight: 600; margin-top: 2px; text-wrap: balance; }
.pnote { color: var(--muted); font-size: 13px; }
.pbest { text-align: right; }
.pbest .num { font-size: 22px; font-weight: 600; color: var(--low); }
.pbest small { display: block; color: var(--muted); font-size: 12px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.chip .num { font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--act); background: var(--act-soft); color: var(--act); font-weight: 600; }
.chip[aria-pressed="true"] .num { color: var(--act); }
.chip .tag { font-size: 11px; color: var(--big); font-weight: 600; }

.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 12px; background: var(--sunk); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.best td { background: var(--low-soft); }
tr.best .price { color: var(--low); font-weight: 600; }
tr.off td { color: var(--muted); }
tr.off .price { text-decoration: line-through; text-decoration-color: var(--line); }
.mall { font-weight: 500; }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
.p-big { background: var(--big-soft); color: var(--big); }
.p-cash { background: var(--warn-soft); color: var(--warn); }
.p-gen { color: var(--muted); font-weight: 500; padding-inline: 0; }
.p-low { background: var(--low); color: var(--surface); }
.p-solo { background: var(--warn-soft); color: var(--warn); }
.go { text-decoration: none; font-weight: 600; font-size: 13px; }
.go:hover { text-decoration: underline; }
.more { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 16px; font-size: 12.5px; color: var(--muted); background: var(--sunk); border-top: 1px solid var(--line); flex-wrap: wrap; }
.more button { border: 0; background: none; color: var(--act); cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 0; }
.solo-note { margin: 0 16px 12px; padding: 8px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }

.receipt { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.receipt h2 { margin: 0; font-size: 15px; }
.rlines { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.rlines li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.rlines .k { color: var(--muted); font-size: 12px; }
.rlines .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rlines .m { display: block; color: var(--muted); font-size: 11.5px; }
.total { border-top: 2px solid var(--ink); padding-top: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.total .num { font-size: 28px; font-weight: 600; color: var(--low); letter-spacing: -0.02em; }
.cmp { display: grid; gap: 6px; font-size: 13px; background: var(--sunk); border-radius: 8px; padding: 10px 12px; }
.cmp div { display: flex; justify-content: space-between; gap: 8px; }
.cmp .cur { font-weight: 600; }
.fine { color: var(--muted); font-size: 12px; margin: 0; }
.reset { justify-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .chip, .modes button { transition: background .15s, color .15s, border-color .15s; } }
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>견적<span>최저가</span></b><small>RTX 5060 게이밍 PC · 다나와 2026.10.13 조회</small></div>
    <div class="modes" role="group" aria-label="가격 기준">
      <button type="button" id="mode-big" data-mode="big">대형몰 · 카드결제</button>
      <button type="button" id="mode-card" data-mode="card">카드결제 전체</button>
      <button type="button" id="mode-all" data-mode="all">현금가 포함 최저</button>
    </div>
  </div>
</header>

<main class="wrap page">
  <section class="parts" id="parts" aria-label="부품별 가격비교"></section>
  <aside class="receipt" aria-label="견적 합계">

    <ul class="rlines" id="rlines"></ul>

    <div class="cmp" id="cmp"></div>
    <p class="fine">배송비 포함 실구매가 기준입니다. 쿠폰·회원 할인은 빠져 있고, 가격은 주문 시점에 달라질 수 있습니다. 대형몰은 G마켓·옥션·11번가·롯데ON·SSG·하이마트·전자랜드 등이며, 실제 판매자는 입점업체일 수 있습니다.</p>
    <button type="button" class="reset" id="reset">추천 구성으로 되돌리기</button>
  </aside>
</main>

    ${solo ? `<div class="solo-note">${esc(b.m)} 한 곳만 다음 판매처보다 ${won(second.p - b.p)} 쌉니다. 쿠폰가나 곧 끝날 특가일 수 있으니 판매자 평점과 정품 표기를 확인하세요.</div>` : ""}
    <div class="tbl-wrap"><table>
      <thead><tr><th>판매처</th><th>결제</th><th>배송</th><th class="r">실구매가</th><th>카드 할인</th><th>무이자</th><th></th></tr></thead>
      <tbody>${rows.map(o => {
        const isBest = b && o === b, off = !ok(o, state.mode);
        return `<tr class="${isBest ? "best" : ""} ${off ? "off" : ""}">
          <td><span class="mall">${esc(o.m)}</span> ${isBig(o.m) ? '<span class="pill p-big">대형몰</span>' : ""} ${isBest ? '<span class="pill p-low">최저</span>' : ""}</td>
          <td>${o.c ? `<span class="pill p-cash">${esc(o.cl || "조건부")}</span>` : '<span class="pill p-gen">일반</span>'}</td>
          <td>${o.s ? won(o.s) : "무료"}</td>
          <td class="r num price">${won(o.p)}</td>
          <td>${o.cp ? `${esc(o.cn)} <span class="num">${won(o.cp)}</span>` : "-"}</td>
          <td>${o.i ? esc(o.i) : "-"}</td>
          <td><a class="go" href="${esc(o.u)}" target="_blank" rel="noopener">구매처 ›</a></td></tr>`;
      }).join("") || `<tr><td colspan="7">이 기준에 맞는 판매처가 없습니다. 위에서 가격 기준을 바꿔 보세요.</td></tr>`}</tbody>
    </table></div>
    <div class="more"><span>다나와 등록 판매처 ${d.count}곳 · 이 기준 해당 ${elig.length}곳 (가격 상위 표본)</span>
      <button type="button" id="more-${p.key}" data-more="${p.key}">${showAll ? "기준 해당만 보기" : "현금가 포함 전체 보기"}</button></div>
  </article>`;
}

function render() {
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  document.getElementById("parts").innerHTML = PARTS.map(renderPart).join("");
  const totals = {};
  for (const m of Object.keys(MODES)) totals[m] = PARTS.reduce((s, p) => { const b = best(state.pick[p.key], m); return s + (b ? b.p * p.qty : 0); }, 0);
  document.getElementById("rlines").innerHTML = PARTS.map(p => {
    const opt = p.opts.find(o => o.pc === state.pick[p.key]) || p.opts[0];
    const b = best(opt.pc, state.mode);
    return `<li><span class="k">${esc(p.cat)}</span><span class="n" title="${esc(opt.name)}">${esc(opt.name)}${p.qty > 1 ? ` ×${p.qty}` : ""}<span class="m">${b ? esc(b.m) : "판매처 없음"}</span></span><span class="num">${b ? won(b.p * p.qty) : "-"}</span></li>`;
  }).join("");
  document.getElementById("total").textContent = won(totals[state.mode]);
  document.getElementById("mode-label").textContent = MODES[state.mode];
  document.getElementById("cmp").innerHTML = Object.entries(MODES).map(([m, label]) =>
    `<div class="${m === state.mode ? "cur" : ""}"><span>${label}</span><span class="num">${won(totals[m])}</span></div>`).join("");
}

document.addEventListener("click", e => {
  const mb = e.target.closest("[data-mode]");
  if (mb) { state.mode = mb.dataset.mode; save(); render(); return; }
  const ch = e.target.closest("[data-pc][data-part]");
  if (ch) { state.pick[ch.dataset.part] = ch.dataset.pc; save(); render(); return; }
  const mo = e.target.closest("[data-more]");
  if (mo) { state.open[mo.dataset.more] = !state.open[mo.dataset.more]; render(); return; }
  if (e.target.id === "reset") { state.pick = { ...DEFAULT }; state.mode = "big"; save(); render(); }
});
render();
</script>

</body>
</html>
